name: Build and Release Standalone Binaries

on:
  release:
    types: [created]
  workflow_dispatch: # Allow manual triggering for testing

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Build with PyInstaller
        run: |
          uv run pyinstaller friday.spec

      - name: Zip build (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/FRIDAY -DestinationPath FRIDAY-Windows.zip

      - name: Zip build (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          cd dist && zip -r ../FRIDAY-${{ runner.os }}.zip FRIDAY

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: FRIDAY-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
